services:
  - type: web
    name: cbc-learning-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run dev
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 10000

  - type: static
    name: cbc-client-ui
    repo: https://github.com/kitowilliam873-del/cbc-learning-platform
    rootContext: frontend
    publishPath: app
    
    
