services:
  - type: web
    name: cbc-learning-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run dev
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 10000

services:
  # Your backend service configuration would be here...

type: static
name: cbc-learning-platform-frontend
repo: https://github.com/kitowilliam873-del/cbc-learning-platform
env: static
# If your HTML files are inside a 'frontend' folder:
rootContext: frontend 
publishPath: ./

