<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior School CBC STEM Portal</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #334155;
            margin-bottom: 24px;
        }
        h1 {
            margin: 0 0 4px 0;
            font-size: 24px;
            color: #38bdf8;
        }
        p {
            margin: 0;
            color: #94a3b8;
            font-size: 14px;
        }
        .card {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #334155;
        }
        .module-box {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #3b82f6;
            margin-top: 16px;
        }
        h3 {
            margin: 0 0 8px 0;
            color: #f8fafc;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Senior School STEM Portal</h1>
            <p>Competency-Based Curriculum • Grade 10 to 12</p>
        </header>

        <main class="card">
            <h2 style="margin-top: 0; font-size: 18px; color: #cbd5e1;">Active Science Modules</h2>
            <div class="module-box">
                <h3>🔬 Chemistry: Gas Laws Unit</h3>
                <p style="margin-bottom: 16px; line-height: 1.6;">Analyze gas volume shifts using Charles's Law under dynamic greenhouse environmental conditions in Kenya.</p>
                <button onclick="launchAssessment()">Launch AI Assessment</button>
            </div>
        </main>
    </div>
<script>
  async function launchAssessment() {
    // 1. Tell the user we are connecting
    console.log("Connecting to live AI Engine...");
    
    try {
      // 2. Call your live Node/Express backend API
      const response = await fetch('https://cbc-learning-platform.onrender.com/api/assessment');
      
      if (!response.ok) {
        throw new Error(`Server error: ${response.status}`);
      }
      
      const data = await response.json();
      
      // 3. Do something with the backend data (e.g., show a prompt or alert)
      alert(`AI Engine Connected! Server says: ${data.message || 'Ready for Gas Laws Assessment'}`);
      
    } catch (error) {
      console.error("Connection failed:", error);
      alert("Could not connect to the backend server. Make sure CORS is enabled!");
    }
  }
</script>
    </body>
</html>
